name: Update Workout Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fitness repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}" >> .env
          echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> .env
          echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> .env

      - name: Fetch Strava data
        run: |
          mkdir -p output
          python run.py fetch --source strava

      - name: Export workout data
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
        run: |
          if python run.py export --output ./output --sheets; then
            echo "exported with google sheets"
          else
            echo "google sheets unavailable, using local data"
            python run.py export --output ./output
          fi

      - name: Checkout jsondev repo
        uses: actions/checkout@v4
        with:
          repository: hz2/jsondev
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: jsondev-repo

      - name: Copy data files to jsondev
        run: cp output/*.json jsondev-repo/data/

      - name: Commit and push to jsondev
        run: |
          cd jsondev-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update workout data"
            git push
          fi
