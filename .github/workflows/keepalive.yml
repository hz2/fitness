name: Keepalive

on:
  schedule:
    # run monthly -- prevents github from disabling the scheduled workout workflow
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
